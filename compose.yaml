services:
  web:
    build: .
    ports:
      - ""${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Укажите DJANGO_SECRET_KEY в .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_USE_HTTPS: ${DJANGO_USE_HTTPS:-0}
    volumes:
      - sqlite_data:/app/data
    command: 
      - sh
      - -c
      - |
        # Остановить запуск при ошибке любой команды.
        set -e
        # Применить миграции и собрать статические файлы.
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        # Запустить приложение одним рабочим процессом.
        exec gunicorn task_manager.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 1 \
          --threads 4 \
          --timeout 60
volumes:
  sqlite_data:
